<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFF8F2">
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tummy diary">
<title>Tummy Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* palette: one accent (rose); the other pastels only tint meal chips */
  --bg:#FFF8F2; --ink:#4A3535; --ink2:#9C8582; --ink3:#C7B3AF; --line:#F1E3E0;
  --rose:#EE7A99; --rose-d:#D9577C; --rose-l:#FFE3EB; --rose-ll:#FFF4F7;
  --blush:#FFE0E8; --blue:#DDEEFF; --blue-d:#8DBFE8; --butter:#FFEDB8; --lav:#ECE3FC; --peach:#FFE3D3;
  --pink:var(--rose);
  --sh-1:0 1px 2px rgba(120,70,80,.06),0 6px 16px -8px rgba(170,90,110,.22);
  --sh-2:0 2px 6px rgba(120,70,80,.05),0 22px 44px -22px rgba(190,100,130,.42);
  --sh-rose:0 12px 24px -10px rgba(235,107,144,.7);
  --grad-rose:linear-gradient(150deg,#F7A2B9 0%,#EC7095 100%);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  --gap:22px; --pw:116px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* registered so they animate and inherit into the mascots' <use> trees (blinks, munching, puffy cheeks) */
@property --open{syntax:'<number>';inherits:true;initial-value:1}
@property --munch{syntax:'<number>';inherits:true;initial-value:0}
@property --puff{syntax:'<number>';inherits:true;initial-value:0}

*{box-sizing:border-box;margin:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:var(--bg)}
body{font:600 15px/1.45 'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;overflow-x:hidden;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
img{-webkit-touch-callout:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:3px}
[hidden]{display:none!important}

/* sky: soft blush / sky / butter glow over dotted paper */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(60% 36% at 6% 0%,#FFE0EA 0%,rgba(255,224,234,0) 72%),
    radial-gradient(52% 30% at 100% 6%,#DFEFFF 0%,rgba(223,239,255,0) 72%),
    radial-gradient(75% 38% at 50% 104%,#FFEFD6 0%,rgba(255,239,214,0) 72%),
    radial-gradient(rgba(210,160,150,.2) 1.1px,transparent 1.4px) 0 0/22px 22px,var(--bg)}
.cloud{position:absolute;left:0;top:var(--t);width:var(--w);opacity:.55;animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
.tw{position:absolute;color:var(--rose);opacity:.4;font-size:var(--s,15px);animation:tw 3.4s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes tw{50%{transform:scale(.6) rotate(25deg);opacity:.12}}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
/* blinks: JS toggles .shut at random gaps; nothing runs between blinks */
[data-blink]{transition:--open .06s}
.shut{--open:0}

/* loader */
.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .6s ease,visibility .6s}
.loader.done{opacity:0;visibility:hidden}
.lb{display:grid;justify-items:center;gap:12px;transition:transform .6s var(--ease)}
.loader.done .lb{transform:scale(.94) translateY(-12px)}
.lb svg{width:108px;animation:hop .7s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-10px) rotate(3deg)}}
.lb b{font:700 26px 'Fredoka',sans-serif;letter-spacing:-.3px;margin-top:6px}
.lb p{font-size:13px;font-weight:800;color:var(--ink2)}
.prog{width:140px;height:7px;margin-top:4px;border-radius:99px;background:var(--rose-l);overflow:hidden}
.prog span{display:block;height:100%;width:0;border-radius:inherit;background:var(--grad-rose);animation:load 1.15s cubic-bezier(.6,0,.3,1) forwards}
@keyframes load{to{width:100%}}

/* entrance */
.reveal{opacity:0}
body.ready .reveal{animation:rise .9s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* layout */
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 18px calc(132px + var(--safe-b))}
.top{display:flex;align-items:center;gap:10px;padding:8px 0 2px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
#kittyBtn{flex:none}
#kittyBtn svg{display:block;width:48px;animation:bob 3.4s ease-in-out infinite}
.brand{font:700 22px/1 'Fredoka',sans-serif;letter-spacing:-.2px;white-space:nowrap}
.brand small{display:block;font:800 11.5px 'Nunito';color:var(--ink2);margin-top:5px;letter-spacing:.1px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;box-shadow:var(--sh-1);display:grid;place-items:center;transition:transform .3s var(--spring)}
.icon-btn:active{transform:scale(.9)}
.chip-btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:99px;background:#fff;box-shadow:var(--sh-1);font-weight:900;font-size:13px;white-space:nowrap;transition:transform .3s var(--spring)}
.chip-btn:active{transform:scale(.94)}
.chip-btn svg.i{width:17px;height:17px}
#todayBtn{background:var(--rose-l);color:var(--rose-d);box-shadow:none}
.layout{display:grid;gap:18px;margin-top:8px}
.side{display:contents}
.panel{position:relative;background:#fff;border-radius:28px;box-shadow:var(--sh-2)}

/* hero: greeting + week, cinnamoroll peeks over the week card */
.hero{order:1;display:grid;gap:14px}
.greet{padding:6px 4px 0}
.greet h1{font:700 clamp(31px,8.4vw,40px)/1.06 'Fredoka',sans-serif;letter-spacing:-.6px;text-wrap:balance}
.sub{margin-top:6px;font-size:14px;font-weight:800;color:var(--ink2)}
/* drawn cloud sized to the lowercase letters and centred on them */
.h-ico{display:inline-block;width:1.1em;height:.5em;vertical-align:.02em;fill:currentColor}
.weekwrap{position:relative;margin-top:calc(var(--pw) * .36)}
.pup{position:absolute;z-index:0;right:22px;top:calc(var(--pw) * -.5);width:var(--pw);animation:peek 4s ease-in-out infinite;transform-origin:50% 100%;transition:transform .45s var(--spring)}
.pup svg{display:block;width:100%}
@keyframes peek{0%,100%{transform:translateY(0)}50%{transform:translateY(5px) rotate(2deg)}}
.week{z-index:1;padding:14px 12px 16px}
.wk-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.wk-h b{font:600 16px 'Fredoka',sans-serif}
.arrows{display:flex;gap:6px}
.arrow{width:44px;height:44px;border-radius:50%;background:var(--rose-ll);color:var(--ink);display:grid;place-items:center;transition:transform .3s var(--spring),opacity .2s}
.arrow svg.i{width:18px;height:18px}
.arrow:active:not(:disabled){transform:scale(.88)}
.arrow:disabled{opacity:.3}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:66px;border-radius:18px;transition:transform .35s var(--spring),background .25s}
.day small{font-size:11px;font-weight:800;color:var(--ink2)}
.day b{font:600 19px 'Fredoka',sans-serif}
.day:active:not(:disabled){transform:scale(.92)}
.day.today:not(.sel) b{color:var(--rose-d)}
.day.today:not(.sel){box-shadow:inset 0 0 0 1.6px var(--rose-l);background:var(--rose-ll)}
.day.sel{background:var(--grad-rose);color:#fff;box-shadow:var(--sh-rose);transform:translateY(-2px)}
.day.sel small{color:rgba(255,255,255,.85)}
.day.has::after{content:'';position:absolute;bottom:7px;width:5px;height:5px;border-radius:50%;background:var(--rose);animation:pop .4s var(--spring)}
.day.sel.has::after{background:#fff}
.day:disabled{opacity:.32}

/* today summary */
.summary{order:2;padding:18px 18px 16px;background:linear-gradient(135deg,#FFE7EF 0%,#FFF2E9 55%,#EAF4FF 100%);box-shadow:var(--sh-1)}
.sum-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.count b{display:block;font:700 46px/.95 'Fredoka',sans-serif;color:var(--rose-d);letter-spacing:-1px}
.count span{display:block;margin-top:6px;font-size:13px;font-weight:800;color:var(--ink2)}
.tm{text-align:right}
.tummy{display:flex;gap:4px;justify-content:flex-end}
.tummy svg{width:23px;height:23px;fill:rgba(255,255,255,.75);stroke:var(--ink3);stroke-width:1.6;overflow:visible}
.tummy svg.f{fill:var(--rose);stroke:var(--rose-d)}
.tummy svg.pop{animation:heartPop .7s var(--spring)}
@keyframes heartPop{0%{transform:scale(.2)}55%{transform:scale(1.4)}}
.tm span{display:block;margin-top:6px;font-size:12px;font-weight:800;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg,#fff);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:900;white-space:nowrap;color:var(--ink)}
.chips .chip{background:rgba(255,255,255,.7)}
.streak{margin-top:12px;font-size:13px;font-weight:800;color:var(--ink2)}

/* scrapbook board: JS deals cards into columns left→right so time order reads like a row */
#plate{order:3}
.plate-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 2px 18px}
.plate-h h2{font:700 25px 'Fredoka',sans-serif;letter-spacing:-.3px}
.plate-h h2 span{color:var(--rose)}
.board{display:flex;align-items:flex-start;gap:var(--gap)}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--gap) + 12px)}
/* tilt comes from the phone gyro (--gx/--gy on .board) or, on desktop, from the mouse (inline --rx/--ry) */
.card{--rx:calc(var(--gy,0) * -1deg);--ry:calc(var(--gx,0) * 1deg);--mx:calc(50% + var(--gx,0) * 4%);--my:calc(50% - var(--gy,0) * 4%);--hx:calc(50% + var(--gx,0) * 7%);
  position:relative;display:block;width:100%;text-align:left;padding:8px 8px 0;background:#fff;border:1.8px solid var(--ink);border-radius:14px;
  box-shadow:0 2px 3px rgba(110,60,70,.08),0 16px 30px -16px rgba(170,85,110,.55);
  transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) rotate(var(--r));transition:transform .45s var(--spring),box-shadow .45s var(--ease)}
.card.tilt{--holo:1;transition:transform .12s ease-out,box-shadow .3s}
.card:active{transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) rotate(var(--r)) scale(.97)}
.pic{position:relative;display:block;border-radius:9px;overflow:hidden;isolation:isolate}
.pic::before,.pic::after{content:'';position:absolute;z-index:1;inset:0;pointer-events:none;opacity:var(--holo,0);display:none}
.board.shine .pic::before,.board.shine .pic::after,.card.tilt .pic::before,.card.tilt .pic::after{display:block}
/* foil: repeating rainbow bands that slide with the tilt */
.pic::before{mix-blend-mode:overlay;opacity:calc(var(--holo,0) * .7);
  background:repeating-linear-gradient(115deg,#ff6fae 0%,#ffd166 7%,#6fffd2 14%,#7d8cff 21%,#e07dff 28%,#ff6fae 35%) var(--hx) 50%/220% 220%}
/* glare: a soft light spot under the finger / mouse */
.pic::after{mix-blend-mode:soft-light;background:radial-gradient(circle at var(--mx) var(--my),#fff,rgba(255,255,255,.35) 25%,rgba(255,255,255,0) 55%)}
.card img,.tile{display:block;width:100%}
.card img{height:auto;max-height:440px;object-fit:cover;background:var(--rose-ll)}
.tile{display:grid;place-items:center;aspect-ratio:var(--ar);background:var(--bg) radial-gradient(rgba(255,255,255,.7) 2px,transparent 2px) 0 0/15px 15px}
.tile span{font-size:clamp(40px,11vw,58px);filter:drop-shadow(0 4px 0 rgba(74,53,53,.1));transition:transform .45s var(--spring)}
.cap{display:grid;gap:7px;padding:10px 3px 11px}
.cap b{font:600 16px/1.22 'Fredoka',sans-serif;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px;white-space:nowrap;font-size:11.5px;font-weight:800;color:var(--ink2)}
.meta .chip{font-size:11px;padding:2px 8px}
.tape{position:absolute;z-index:2;top:-10px;left:50%;width:66px;height:20px;transform:translateX(-50%) rotate(var(--tr));opacity:.88;
  clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%)}
.tape.c1{left:-14px;top:5px;width:50px;transform:rotate(-38deg)}
.tape.c2{left:auto;right:-14px;top:5px;width:50px;transform:rotate(38deg)}
.t0{background:repeating-linear-gradient(45deg,#F7B9C6 0 6px,#FDE1E7 6px 12px)}
.t1{background:radial-gradient(#fff 2px,transparent 2.5px) 0 0/9px 9px,#B9DCF3}
.t2{background:linear-gradient(90deg,rgba(255,255,255,.55) 50%,transparent 0) 0 0/10px 10px,linear-gradient(rgba(255,255,255,.55) 50%,transparent 0) 0 0/10px 10px,#FFE08F}
.t3{background:repeating-linear-gradient(90deg,#E2D4F6 0 8px,#D2C1F0 8px 10px)}
.sticker{position:absolute;right:-11px;bottom:42px;font-size:27px;line-height:1;transform:rotate(var(--sr));pointer-events:none;
  text-shadow:1.5px 0 #fff,-1.5px 0 #fff,0 1.5px #fff,0 -1.5px #fff,1.5px 1.5px #fff,-1.5px -1.5px #fff,1px 3px 3px rgba(74,53,53,.3)}
.in{animation:drop .75s var(--spring) backwards;animation-delay:calc(var(--i) * 70ms)}
.new{animation:drop .85s var(--spring) backwards}
@keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(calc(var(--r) * -4)) scale(.9)}}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.9)}}

/* empty: cinnamoroll naps */
.empty{display:grid;justify-items:center;text-align:center;gap:5px;padding:4px 20px 8px;animation:pop .6s var(--spring)}
.nap{position:relative;width:150px;margin-bottom:4px}
.nap svg{display:block;width:100%;--open:0;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
.z{position:absolute;right:20px;top:10px;font:700 19px 'Fredoka',sans-serif;color:var(--blue-d);opacity:0;animation:zz 3s ease-in infinite;animation-delay:var(--dl)}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(24px,-44px) scale(1.3)}}
.empty b{font:600 19px 'Fredoka',sans-serif}
.empty p{font-size:14px;font-weight:700;color:var(--ink2)}

/* mood + diary */
.mood-p{order:4;padding:18px 16px 16px}
.p-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 12px}
.p-h h3{font:600 18px 'Fredoka',sans-serif}
.saved{font-size:12px;font-weight:900;color:var(--rose);opacity:0;transform:translateY(3px);transition:.3s;pointer-events:none}
.saved.on{opacity:1;transform:none}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.mood{justify-self:center;width:100%;max-width:58px;aspect-ratio:1;border-radius:50%;background:var(--rose-ll);font-size:27px;line-height:1;display:grid;place-items:center;transition:transform .4s var(--spring),opacity .3s,filter .3s,box-shadow .3s,background .3s}
.mood:active{transform:scale(.86)}
.mood[aria-pressed=true]{background:#fff;box-shadow:0 0 0 2.5px var(--rose),var(--sh-rose);transform:scale(1.1)}
.moods:has([aria-pressed=true]) .mood:not([aria-pressed=true]){opacity:.5;filter:saturate(.5)}
textarea{display:block;width:100%;min-height:96px;resize:vertical;padding:4px 14px;border:0;border-radius:18px;font:600 16px/28px 'Nunito';color:var(--ink);
  background:repeating-linear-gradient(transparent 0 27px,rgba(238,122,153,.16) 27px 28px) var(--rose-ll);background-attachment:local;transition:box-shadow .25s}
textarea:focus{outline:none;box-shadow:0 0 0 3px var(--rose-l)}
textarea::placeholder{color:var(--ink3)}

/* fab */
.fab{position:fixed;right:18px;bottom:calc(20px + var(--safe-b));z-index:20;width:62px;height:62px;border-radius:50%;background:var(--grad-rose);color:#fff;display:grid;place-items:center;
  box-shadow:0 16px 30px -10px rgba(235,107,144,.75),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .4s var(--spring)}
.fab svg{width:28px;transition:transform .45s var(--spring)}
.fab:active{transform:scale(.9)}
.fab::after{content:'add a nibble';position:absolute;right:76px;white-space:nowrap;background:#fff;border-radius:99px;padding:7px 14px;font-weight:900;font-size:13px;color:var(--ink);box-shadow:var(--sh-1);opacity:0;transform:translateX(8px);transition:.3s var(--spring);pointer-events:none}
.fab::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid var(--rose);opacity:0;pointer-events:none}
.fab.nudge::before{animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(1.55);opacity:0}}
.spark{position:fixed;z-index:60;pointer-events:none;font-size:var(--fs,18px);font-weight:900}

/* kitty pops up from the bottom edge and waves */
.peek{position:fixed;left:clamp(14px,4vw,40px);bottom:0;z-index:30;width:104px;transform:translateY(115%);transition:transform .55s var(--spring);pointer-events:none}
.peek.on{transform:translateY(24%)}
.peek svg{position:relative;display:block;width:100%}
.paw{position:absolute;left:81px;top:20px;width:22px;height:28px;background:#fff;border:2.4px solid #5B3A3A;border-radius:50%;transform-origin:50% 100%}
.peek.on .paw{animation:wave .4s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-15deg)}to{transform:rotate(30deg)}}
.bubble{position:absolute;bottom:calc(100% - 2px);background:#fff;border:1.8px solid var(--ink);border-radius:18px 18px 18px 6px;padding:7px 14px;font:600 15px 'Fredoka',sans-serif;white-space:nowrap;box-shadow:var(--sh-2)}
.peek .bubble{left:62%}
.peek.on .bubble{animation:pop .5s var(--spring) .25s both}

/* feed cinnamoroll: whichever one is on screen eats; the napping one wakes, the peeking one stretches up */
.feeder{position:fixed;left:50%;bottom:0;z-index:31;width:170px;margin-left:-85px;transform:translateY(110%);transition:transform .55s var(--spring);pointer-events:none}
.feeder.on{transform:translateY(16%)}
.feeder svg{display:block;width:100%;transform-origin:50% 100%}
.feeder svg,.nap svg,.pup svg{transition:--munch .15s ease-out,--open .06s}
.nap.on svg{--open:1;animation:none}
.nap.on .z{display:none}
.pup.on{animation:none;transform:translateY(-26%)}
.feeder.open svg,.nap.open svg,.pup.open svg{--munch:1}
.feeder.chew svg,.nap.chew svg,.pup.chew svg{animation:chew .2s ease-in-out 6 alternate}
@keyframes chew{to{transform:scale(1.07,.93);--puff:1}}
.feeder .bubble{left:60%;opacity:0}
.feeder.talk .bubble{opacity:1;animation:pop .45s var(--spring) both}
.token{position:fixed;z-index:32;width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 18px rgba(74,53,53,.3);pointer-events:none}
span.token{display:grid;place-items:center;border:0;box-shadow:none;font-size:44px;line-height:1;filter:drop-shadow(0 4px 4px rgba(74,53,53,.25))}
.rain{position:fixed;top:0;z-index:61;font-size:32px;line-height:1;pointer-events:none}

/* shared-element morphs (View Transitions API, desktop) */
::view-transition-group(pick){animation-duration:.5s;animation-timing-function:cubic-bezier(.3,1.2,.4,1)}
::view-transition-old(pick),::view-transition-new(pick){height:100%;object-fit:cover;animation-duration:.28s}
::view-transition-group(root){animation-duration:.3s}
dialog.vt[open]{animation:none}

/* dialogs: centred cards on desktop, bottom sheets that slide up on phones */
dialog{margin:auto;border:0;padding:0;background:none;width:calc(100% - 32px);max-width:440px;overflow:visible;color:var(--ink)}
dialog .win{background:#fff;border-radius:30px;box-shadow:0 30px 80px -24px rgba(90,40,55,.5);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;outline:none}
dialog[open]{animation:dlg .5s var(--spring)}
dialog.closing{animation:dlgOut .22s ease-in forwards}
dialog::backdrop{background:rgba(74,40,52,.26);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .35s}
dialog.closing::backdrop{animation:fade .22s reverse forwards}
@keyframes dlg{from{opacity:0;transform:translateY(30px) scale(.94)}}
@keyframes dlgOut{to{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes fade{from{opacity:0}}
dialog .bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:18px 14px 8px 22px;background:#fff}
dialog .bar .t{flex:1;font:700 21px 'Fredoka',sans-serif;letter-spacing:-.2px}
.x{width:44px;height:44px;border-radius:50%;background:var(--rose-ll);display:grid;place-items:center;transition:transform .3s var(--spring)}
.x:active{transform:scale(.88)}
.x svg.i{width:18px;height:18px}
.grab{display:none}
.form{display:grid;gap:18px;padding:8px 20px 22px}
.photo{position:relative}
.drop{position:relative;display:grid;place-items:center;align-content:center;gap:8px;min-height:150px;border:2px dashed #F4B6C7;border-radius:22px;background:var(--rose-ll);cursor:pointer;text-align:center;font-weight:800;font-size:14px;color:var(--ink2);overflow:hidden;transition:background .2s,border-color .2s}
.drop.over,.drop:active{background:var(--rose-l);border-color:var(--rose)}
.drop:focus-within{outline:3px solid var(--blue-d);outline-offset:2px}
.drop .cam{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);display:grid;place-items:center;color:var(--rose-d);transition:transform .4s var(--spring)}
.drop .cam svg.i{width:24px;height:24px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .4s}
.rm{position:absolute;top:10px;right:10px;z-index:2;min-height:40px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.95);box-shadow:var(--sh-1);font-size:13px;font-weight:900}
.field{border:0;padding:0;min-width:0}
.field label,.field legend{display:block;font-weight:900;font-size:13px;color:var(--ink2);margin-bottom:8px;padding:0}
.inp{display:block;width:100%;min-height:52px;padding:0 16px;border:1.8px solid transparent;border-radius:16px;font:700 16px 'Nunito';color:var(--ink);background:#FFF5F7;transition:border-color .2s,box-shadow .2s,background .2s;-webkit-appearance:none;appearance:none}
.inp:focus{outline:none;background:#fff;border-color:var(--rose);box-shadow:0 0 0 4px rgba(238,122,153,.16)}
.inp::placeholder{color:var(--ink3)}
.inp[type=time]{display:flex;align-items:center}
.inp::-webkit-date-and-time-value{text-align:left}
.meals{display:flex;flex-wrap:wrap;gap:8px}
.meals label{display:block;margin:0;color:var(--ink)}
.meals input{position:absolute;opacity:0;pointer-events:none}
.meals span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border:1.8px solid var(--line);border-radius:99px;background:#fff;font-weight:900;font-size:14px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .35s var(--spring),background .2s,border-color .2s,box-shadow .2s}
.meals input:checked+span{background:var(--bg);border-color:transparent;box-shadow:inset 0 0 0 1.8px rgba(74,53,53,.28);transform:translateY(-2px)}
.meals input:focus-visible+span{outline:3px solid var(--blue-d);outline-offset:2px}
.actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding-top:4px}
.btn{min-height:50px;padding:0 22px;border-radius:99px;background:var(--rose-ll);font-weight:900;font-size:15px;transition:transform .3s var(--spring),box-shadow .3s}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--grad-rose);color:#fff;box-shadow:var(--sh-rose)}
.btn.ghost{margin-right:auto;background:none;color:var(--rose-d);padding-inline:6px}

/* calendar */
.cal-b{padding:4px 18px 20px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-h h3{font:600 18px 'Fredoka',sans-serif}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:11px;font-weight:900;text-align:center;color:var(--ink3);padding-bottom:4px}
.cd{aspect-ratio:1;min-width:0;border-radius:15px;background:transparent center/cover;font:600 14px 'Fredoka',sans-serif;position:relative;display:grid;place-items:center;transition:transform .3s var(--spring)}
.cd:active:not(:disabled){transform:scale(.9)}
.cd em{font-style:normal;font-size:19px}
.cd.has{background-color:var(--rose-ll)}
.cd.has span{position:absolute;top:3px;left:6px;font-size:10px;color:var(--ink2)}
.cd.ph{box-shadow:inset 0 0 0 1.5px rgba(74,53,53,.15)}
.cd.ph span{background:rgba(255,255,255,.92);border-radius:7px;padding:0 4px;color:var(--ink)}
.cd.today{box-shadow:inset 0 0 0 2px var(--rose-l);color:var(--rose-d)}
.cd.sel{outline:2.5px solid var(--rose);outline-offset:2px}
.cd:disabled{opacity:.3}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(98px + var(--safe-b));z-index:50;display:flex;gap:14px;align-items:center;min-height:48px;max-width:calc(100vw - 32px);width:max-content;padding:8px 20px;border-radius:20px;
  background:rgba(74,53,53,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-weight:800;font-size:14px;text-align:center;box-shadow:0 16px 34px -12px rgba(74,40,52,.55);
  transform:translate(-50%,calc(100% + 140px));visibility:hidden;transition:transform .5s var(--spring),visibility .5s}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast button{min-height:44px;color:#FFC2D3;font-weight:900;text-decoration:underline}

/* seasonal skin: october turns on the mascots' halloween hats */
.s-oct{--hallo:1}

/* hover only on real pointers, so taps on phones don't leave cards stuck "lifted" */
@media (hover:hover){
  .icon-btn:hover,.chip-btn:hover{transform:translateY(-2px)}
  .day:hover:not(:disabled):not(.sel){background:var(--rose-ll);transform:translateY(-2px)}
  .arrow:hover:not(:disabled){transform:scale(1.08)}
  .mood:hover:not([aria-pressed=true]){transform:scale(1.12) rotate(-8deg)}
  .card:hover{transform:perspective(800px) translateY(-6px) scale(1.03) rotateX(var(--rx)) rotateY(var(--ry));box-shadow:0 4px 6px rgba(110,60,70,.08),0 26px 40px -18px rgba(170,85,110,.6)}
  .card:hover .tile span{transform:scale(1.15) rotate(-8deg)}
  .fab:hover{transform:translateY(-3px) scale(1.05)}
  .fab:hover svg{transform:rotate(90deg)}
  .fab:hover::after{opacity:1;transform:none}
  .drop:hover{background:var(--rose-l);border-color:var(--rose)}
  .drop:hover .cam{transform:scale(1.1) rotate(-8deg)}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost:hover{transform:none;text-decoration:underline}
  .cd:hover:not(:disabled){transform:scale(1.1);z-index:1}
  .x:hover{background:var(--rose-l)}
}

/* desktop: sticky sidebar + wide board */
@media (min-width:960px){
  :root{--pw:124px}
  .wrap{padding:22px 32px 120px}
  .layout{grid-template-columns:380px 1fr;gap:36px;align-items:start;margin-top:14px}
  .side{display:grid;gap:20px;position:sticky;top:20px}
  .greet h1{font-size:42px}
  .plate-h{margin-top:4px}
  .fab{right:40px;bottom:36px;width:66px;height:66px}
  .toast{bottom:36px}
}
/* phones: bottom sheets */
@media (max-width:600px){
  :root{--gap:13px}
  .card{padding:7px 7px 0;border-radius:12px;border-width:1.6px}
  .cap{padding:8px 2px 10px;gap:6px}
  .cap b{font-size:14.5px}
  .tape{width:54px;height:17px;top:-9px}
  .tape.c1,.tape.c2{width:42px}
  .sticker{font-size:23px;right:-8px;bottom:36px}
  .feeder{width:150px;margin-left:-75px}
  .peek{width:92px}
  .paw{left:72px;top:18px;width:20px;height:25px}
  dialog{width:100%;max-width:none;margin:auto 0 0}
  dialog .win{max-height:92dvh;border-radius:30px 30px 0 0;box-shadow:0 -12px 40px -10px rgba(90,40,55,.3);padding-bottom:var(--safe-b)}
  dialog .bar{touch-action:none;padding-top:24px}
  .grab{display:block;position:absolute;top:9px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:9px;background:var(--ink3);opacity:.6}
  dialog[open]{animation:sheetIn .5s var(--ease)}
  dialog.closing{animation:sheetOut .28s cubic-bezier(.4,0,1,1) forwards}
  .form{padding:6px 18px 20px}
  .actions .btn{flex:1}
  .actions .btn.ghost{flex:none}
}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

  </symbol>

<div class="sky" aria-hidden="true">
  <svg class="cloud" style="--t:7%;--w:130px;--d:95s;--dl:-20s"><use href="#cloud"/></svg>
  <svg class="cloud" style="--t:38%;--w:90px;--d:120s;--dl:-70s"><use href="#cloud"/></svg>
  <svg class="cloud" style="--t:66%;--w:150px;--d:140s;--dl:-35s"><use href="#cloud"/></svg>
  <svg class="cloud" style="--t:88%;--w:110px;--d:110s;--dl:-90s"><use href="#cloud"/></svg>
  <span class="tw" style="top:14%;left:5%">✦</span>
  <span class="tw" style="top:47%;right:4%;--dl:-1s;--s:18px">♡</span>
  <span class="tw" style="top:78%;left:3%;--dl:-2s;--s:12px">✦</span>
</div>

<div class="loader" id="loader" role="status">
  <div class="lb">
    <svg viewBox="0 0 120 100" aria-hidden="true" data-blink><use href="#kitty"/></svg>
    <b>tummy diary</b>
    <p id="loadMsg">warming up the kitchen…</p>
    <div class="prog"><span></span></div>
  </div>
</div>

<div class="wrap">
  <header class="top reveal">
    <div class="logo">
      <button id="kittyBtn" aria-label="boop hello kitty"><svg viewBox="0 0 120 100" aria-hidden="true" data-blink><use href="#kitty"/></svg></button>
      <div class="brand">tummy diary<small>a soft little food journal ♡</small></div>
    </div>
    <button class="chip-btn" id="todayBtn" hidden>today</button>
    <button class="icon-btn" id="calBtn" aria-label="open calendar"><svg class="i"><use href="#i-cal"/></svg></button>
  </header>

  <div class="layout">
    <div class="side">
      <section class="hero reveal" style="--d:.06s">
        <div class="greet">
          <h1 id="hello">hello ♡</h1>
          <p class="sub" id="date"></p>
        </div>
        <div class="weekwrap">
          <button class="pup" id="cinna" aria-label="pet cinnamoroll"><svg viewBox="0 0 200 170" aria-hidden="true" data-blink><use href="#pup"/></svg></button>
          <div class="panel week">
            <div class="wk-h">
              <b id="wkLabel"></b>
              <div class="arrows">
                <button class="arrow" id="prev" aria-label="previous week"><svg class="i"><use href="#i-left"/></svg></button>
                <button class="arrow" id="next" aria-label="next week"><svg class="i"><use href="#i-right"/></svg></button>
              </div>
            </div>
            <div class="days" id="days"></div>
          </div>
        </div>
      </section>

        </div>
        <div class="chips" id="mealStats"></div>
        <p class="streak" id="streak"></p>
      </section>

      <section class="panel mood-p reveal" style="--d:.24s">
        <div class="p-h"><h3>how's your heart?</h3><span class="saved" id="saved">saved ♡</span></div>
        <div class="moods" id="moods"></div>
        <textarea id="note" aria-label="daily note" placeholder="dear diary… today i felt"></textarea>
      </section>
    </div>

    <section id="plate" class="reveal" style="--d:.18s">
      <div class="plate-h"><h2>my plate <span>✿</span></h2><button class="chip-btn" id="shareBtn" hidden><svg class="i"><use href="#i-share"/></svg>share</button></div>

<div class="peek" id="peek" aria-hidden="true">

  <svg viewBox="0 0 120 100" data-blink><use href="#kitty"/></svg>

<dialog id="sheet" aria-labelledby="sheetT">

          <img id="preview" alt="photo preview" hidden>
        </label>

      </div>
      <div class="field">

        <input class="inp" id="fName" required maxlength="80" autocomplete="off" enterkeyhint="done" placeholder="iced matcha latte, avo toast…">

        <button class="btn primary">save ♡</button>
      </div>
    </form>
  </div>
</dialog>

<dialog id="cal" aria-label="calendar">
  <div class="win" tabindex="-1">
    <div class="bar"><span class="grab"></span><span class="t">your days</span><button class="x" data-close aria-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="cal-b">
      <div class="cal-h">
        <button class="arrow" id="cPrev" aria-label="previous month"><svg class="i"><use href="#i-left"/></svg></button>
        <h3 id="cTitle"></h3>
        <button class="arrow" id="cNext" aria-label="next month"><svg class="i"><use href="#i-right"/></svg></button>
      </div>
      <div class="grid" id="cGrid"></div>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* dates: local YYYY-MM-DD keys (not toISOString, which is UTC and shifts days) */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtTime = t => { const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'am' : 'pm'}`; };
const esc = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);

const MEALS = {
  breakfast: { e: '🥞', c: 'var(--butter)' }, lunch: { e: '🍱', c: 'var(--blue)' },
  dinner: { e: '🍝', c: 'var(--blush)' }, snack: { e: '🍓', c: 'var(--lav)' }, drink: { e: '🧋', c: 'var(--peach)' },
};
const MOODS = { happy: '😊', sad: '😭', oops: '😅', love: '😻', meh: '😕' };
const MOOD_NAMES = { happy: 'happy', sad: 'crying', oops: 'oops', love: 'in love', meh: 'meh' };
const MOOD_ALIAS = { calm: 'happy', sleepy: 'meh' }; // moods saved before the emoji refresh
const OCT = new Date().getMonth() === 9;
const STICKERS = ['🎀', '🌸', '💗', '⭐', '🍓', '☁️', ...(OCT ? ['🎃', '👻'] : [])];
const CHEERS = ['yum! ♡', 'nom nom ♡', 'so proud of u ✿', 'tasty!!', 'good job eating ☁', 'more pls ♡'];
const MOOD_LINES = { happy: 'yay, love that for u ♡', sad: 'sending big hugs ♡', oops: 'happens to all of us ✿', love: 'heart eyes!! ♡', meh: 'tomorrow will be cuter ☁' };
// drawn cloud instead of the ☁ glyph, which fonts render sitting too high
const CLOUD_ICON = '<svg class="h-ico" viewBox="3 5 111 50" aria-hidden="true"><path d="M22 52 C6 52 4 34 18 31 C16 16 36 10 44 22 C50 6 76 6 80 24 C96 18 110 30 102 42 C114 46 108 54 98 52 Z"/></svg>';
const HEART ='M12 20.5s-7-4.3-9.2-8.6C1.2 8.7 3 5 6.6 5c2.2 0 3.7 1.3 5.4 3.2C13.7 6.3 15.2 5 17.4 5 21 5 22.8 8.7 21.2 11.9 19 16.2 12 20.5 12 20.5z';
let tummyWas = { k: null, n: 0 }, party = false;
const pick = a => a[Math.random() * a.length | 0];
const buzz = p => { if (!calm && navigator.vibrate) navigator.vibrate(p); }; // android haptics; no-op elsewhere
const FOOD = { matcha: '🍵', tea: '🍵', coffee: '☕', latte: '☕', boba: '🧋', smoothie: '🥤', juice: '🧃', water: '💧',
  croissant: '🥐', bagel: '🥯', toast: '🍞', bread: '🍞', egg: '🍳', pancake: '🥞', waffle: '🧇', oat: '🥣', yogurt: '🥣', cereal: '🥣',
  strawberr: '🍓', berr: '🫐', banana: '🍌', apple: '🍎', fruit: '🍓', avocado: '🥑', avo: '🥑', salad: '🥗', sushi: '🍣', ramen: '🍜',
  noodle: '🍜', pho: '🍜', rice: '🍚', curry: '🍛', pasta: '🍝', spaghetti: '🍝', pizza: '🍕', burger: '🍔', fries: '🍟', taco: '🌮',
  sandwich: '🥪', soup: '🍲', chicken: '🍗', steak: '🥩', fish: '🐟', cake: '🍰', cookie: '🍪', donut: '🍩', chocolate: '🍫',
  'ice cream': '🍦', candy: '🍬', popcorn: '🍿', cheese: '🧀' };
const guess = name => { for (const [k, e] of Object.entries(FOOD)) if (new RegExp('\\b' + k, 'i').test(name)) return e; return null; };
const defaultMeal = h => h < 11 ? 'breakfast' : h < 15 ? 'lunch' : h < 18 ? 'snack' : 'dinner';
const colCount = () => Math.max(2, Math.min(4, Math.floor(($('#board').clientWidth || innerWidth) / 205)));
// deal items round-robin so reading order runs left→right across columns
const deal = (items, n) => Array.from({ length: n }, (_, c) => items.filter((_, i) => i % n === c));

// self-check: no UTC/DST drift, keyword match only at word starts ("steak" must not match "tea"), dealing keeps every item
console.assert(addDays('2026-03-08', 1) === '2026-03-09' && addDays('2026-01-31', 1) === '2026-02-01' && addDays('2026-11-01', -1) === '2026-10-31', 'addDays');
console.assert(guess('steak') === '🥩' && guess('Iced matcha latte') === '🍵' && guess('xyz') === null, 'guess');
console.assert(fmtTime('00:05') === '12:05 am' && fmtTime('13:30') === '1:30 pm', 'fmtTime');
console.assert(JSON.stringify(deal([1, 2, 3, 4, 5], 2)) === '[[1,3,5],[2,4]]', 'deal');
console.assert(![...Array(300)].some((_, i) => /undefined|NaN|t-/.test(card({ id: 'k' + i * 7919, name: 'x' + i, meal: 'snack', time: '10:00' }, 0, ''))), 'card decor');

/* storage: IndexedDB (photos would blow localStorage's ~5MB fast), one record per day */
const DB = new Promise((res, rej) => {
  const r = indexedDB.open('tummy-diary', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('days');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const tx = (mode, fn) => DB.then(db => new Promise((res, rej) => {
  const t = db.transaction('days', mode), req = fn(t.objectStore('days'));
  t.oncomplete = () => res(req.result);
  t.onerror = t.onabort = () => rej(t.error);
}));
const blank = () => ({ items: [], mood: null, note: '' });
const getDay = k => tx('readonly', s => s.get(k)).then(d => {
  if (!d) return blank();
  if (MOOD_ALIAS[d.mood]) d.mood = MOOD_ALIAS[d.mood];
  return d;
});
const isEmpty = d => !d.items.length && !d.mood && !d.note.trim();

let cur = todayKey(), lastToday = cur, day = blank(), logged = new Set(), editing = null, photo = null, cols = colCount();

async function save(k = cur, d = day) {
  try {
    await tx('readwrite', s => isEmpty(d) ? s.delete(k) : s.put(d, k));
    isEmpty(d) ? logged.delete(k) : logged.add(k);
    renderWeek(); renderStats();
    return true;
  } catch {
    toast("couldn't save that 🥺 storage may be full");
    return false;
  }
}

/* render */
function renderHero() {
  const d = dateOf(cur), h = new Date().getHours();
  const hi = h < 5 ? 'sweet dreams' : h < 12 ? 'good morning' : h < 17 ? 'good afternoon' : h < 21 ? 'good evening' : 'sweet dreams';
  const isToday = cur === todayKey();
  $('#hello').textContent = isToday ? `${hi} ♡` : `a peek at ${d.toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase()} `;
  if (!isToday) $('#hello').insertAdjacentHTML('beforeend', CLOUD_ICON);
  $('#date').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).toLowerCase();
  $('#todayBtn').hidden = cur === todayKey();
  renderWeek();
}

function renderWeek() {
  const t = todayKey(), mon = addDays(cur, -((dateOf(cur).getDay() + 6) % 7));
  $('#days').innerHTML = [...Array(7)].map((_, i) => {
    const k = addDays(mon, i), d = dateOf(k);
    const cls = [k === cur && 'sel', k === t && 'today', logged.has(k) && 'has'].filter(Boolean).join(' ');
    return `<button class="day ${cls}" data-k="${k}" ${k > t ? 'disabled' : ''} ${k === cur ? 'aria-current="date"' : ''} aria-label="${d.toDateString()}">
      <small>${d.toLocaleDateString('en-US', { weekday: 'short' }).toLowerCase()}</small><b>${d.getDate()}</b></button>`;
  }).join('');
  $('#next').disabled = addDays(mon, 7) > t;
  const md = k => dateOf(k).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toLowerCase(), sun = addDays(mon, 6);
  $('#wkLabel').textContent = mon <= t && t <= sun ? 'this week' : `${md(mon)} – ${md(sun).replace(/^[a-z]+ /, s => mon.slice(5, 7) === sun.slice(5, 7) ? '' : s)}`;
}

function renderMood() {
  document.querySelectorAll('.mood').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === day.mood));
  $('#note').value = day.note;
}

function renderStats() {
  const n = day.items.length;
  $('#count').textContent = n;
  $('#countLbl').textContent = n === 1 ? 'nibble today' : 'nibbles today';
  $('#mealStats').innerHTML = Object.entries(MEALS).map(([m, v]) => {
    const c = day.items.filter(i => i.meal === m).length;
    return `<span class="chip" style="--bg:${v.c}" aria-label="${c} ${m}">${v.e} ${c}</span>`;
  }).join('');
  const got = new Set(day.items.map(i => i.meal)).size, grew = tummyWas.k === cur && got > tummyWas.n;
  party = grew && got === 5;
  $('#tummy').innerHTML = Object.keys(MEALS).map((_, i) =>
    `<svg viewBox="0 0 24 24" class="${i < got ? 'f' : ''} ${grew && i >= tummyWas.n && i < got ? 'pop' : ''}"><path d="${HEART}"/></svg>`).join('');
  $('#tummy').setAttribute('aria-label', `${got} of 5 hearts`);
  $('#tummyL').textContent = got === 5 ? 'tummy happiness · full! ✿' : `tummy happiness · ${got}/5`;
  tummyWas = { k: cur, n: got };
  let s = 0, k = todayKey();
  if (!logged.has(k)) k = addDays(k, -1); // today isn't over yet, so the streak is still alive
  while (logged.has(k)) { s++; k = addDays(k, -1); }
  $('#streak').textContent = s ? `✿ ${s}-day streak, so proud of u` : '✿ log today to start a streak';
}

function card(it, i, cls) {
  const m = MEALS[it.meal], h = hash(it.id);
  const pic = it.photo
    ? `<img src="${it.photo}" alt="" loading="lazy">`
    : `<span class="tile" style="--bg:${m.c};--ar:${['1', '4/5', '5/4'][h % 3]}"><span>${guess(it.name) || m.e}</span></span>`;
  const tape = h % 4 === 3
    ? `<span class="tape c1 t${(h >>> 3) % 4}"></span><span class="tape c2 t${(h >>> 5) % 4}"></span>`
    : `<span class="tape t${(h >>> 3) % 4}"></span>`;
  const sticker = (h >>> 7) % 3 === 0 ? `<span class="sticker" style="--sr:${((h >>> 9) % 5 - 2) * 9}deg">${STICKERS[(h >>> 11) % STICKERS.length]}</span>` : '';
  return `<button class="card ${cls}" style="--i:${i};--r:${((h >>> 13) % 5 - 2) * .9}deg;--tr:${((h >>> 15) % 7 - 3) * 2.5}deg" data-id="${it.id}" aria-label="${esc(it.name)}, ${it.meal}, ${fmtTime(it.time)}. tap to edit">
    ${tape}<span class="pic">${pic}</span><span class="cap"><b>${esc(it.name)}</b><span class="meta"><span class="chip" style="--bg:${m.c}">${m.e} ${it.meal}</span><time>${fmtTime(it.time)}</time></span></span>${sticker}</button>`;
}

function renderBoard(anim, freshId, dir = 0) {
  const items = [...day.items].sort((a, b) => a.time.localeCompare(b.time)), isToday = cur === todayKey();
  cols = colCount();
  const idx = new Map(items.map((it, i) => [it, i]));
  $('#board').innerHTML = items.length ? deal(items, cols).map(col => `<div class="col">${col.map(it =>
    card(it, idx.get(it), anim ? 'in' : it.id === freshId ? 'new' : '')).join('')}</div>`).join('') : '';
  $('#empty').hidden = items.length > 0;
  $('#emptyT').textContent = isToday ? 'your plate is empty…' : 'no nibbles this day';
  $('#emptyP').textContent = isToday ? 'tap the + to log your first nibble ☁' : 'tap + to add something ☁';
  $('#fab').classList.toggle('nudge', !items.length && isToday);
  $('#shareBtn').hidden = !items.length;
  if (dir && !calm) $('#plate').animate([{ opacity: 0, transform: `translateX(${dir * 30}px)` }, { opacity: 1, transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

function render(dir, anim = true) { renderHero(); renderMood(); renderStats(); renderBoard(anim, null, dir); }

let navId = 0;
async function go(k, dir = 0) {
  if (k === cur) return;
  const id = ++navId;
  if (flushNote) await flushNote(); // finish saving the note of the day she's leaving
  dir = dir || (k > cur ? 1 : -1);
  const d = await getDay(k).catch(blank);
  if (id !== navId) return; // a newer tap won the race
  cur = k; day = d; // switch key and data together, so no edit can ever land on the wrong day
  render(dir);
}

/* dialogs */
const vtOK = !!document.startViewTransition && !calm && !matchMedia('(max-width:600px)').matches;
const onScreen = el => { if (!el || !el.isConnected) return false; const r = el.getBoundingClientRect(); return r.width > 0 && r.bottom > 0 && r.top < innerHeight; };
// shared-element morph: `from` turns into whatever getTo() returns after change() runs
function morph(from, change, getTo) {
  if (!vtOK || !onScreen(from)) { change(); return Promise.resolve(); }
  from.style.viewTransitionName = 'pick';
  let to = null;
  const vt = document.startViewTransition(() => {
    from.style.viewTransitionName = '';
    change();
    to = getTo();
    if (onScreen(to)) to.style.viewTransitionName = 'pick'; else to = null;
  });
  vt.ready.catch(() => {}); // a newer transition skipping this one is fine, not an error
  return vt.finished.catch(() => {}).finally(() => { if (to) to.style.viewTransitionName = ''; });
}
// open a dialog by morphing out of the element that opened it (and remember it, to morph back into)
function openWith(d, getFrom, after) {
  d._from = getFrom;
  if (vtOK && onScreen(getFrom())) d.classList.add('vt'); // the morph replaces the css pop-in
  return morph(getFrom(), () => { d.showModal(); after && after(); }, () => d.querySelector('.win'));
}
function dismiss(d, getTo = d._from, change) {
  if (!d.open || d.classList.contains('closing')) return Promise.resolve();
  if (!vtOK) { closeDialog(d); change && change(); return Promise.resolve(); }
  return morph(d.querySelector('.win'), () => { d.close(); change && change(); }, getTo || (() => null));
}
function closeDialog(d) {
  if (!d.open || d.classList.contains('closing')) return;
  d.classList.remove('vt'); // otherwise `animation:none` would swallow the close animation and it'd never finish
  d.classList.add('closing');
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    d.removeEventListener('animationend', onEnd);
    d.classList.remove('closing');
    d.querySelector('.win').style.transform = '';
    d.close();
  };
  const onEnd = e => { if (e.target === d && !e.pseudoElement) finish(); }; // ::backdrop ends earlier
  d.addEventListener('animationend', onEnd);
  setTimeout(finish, 450); // in case no animation runs at all
}
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('cancel', e => { e.preventDefault(); dismiss(d); }); // esc + android back gesture
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) dismiss(d); });
  d.addEventListener('close', () => d.classList.remove('vt'));
  // swipe the title bar down to dismiss (phones)
  const bar = d.querySelector('.bar'), win = d.querySelector('.win');
  let y0 = null;
  bar.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || e.target.closest('button')) return;
    y0 = e.clientY; win.style.transition = 'none'; bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e => { if (y0 !== null) win.style.transform = `translateY(${Math.max(0, e.clientY - y0)}px)`; });
  const end = e => {
    if (y0 === null) return;
    const dy = e.clientY - y0;
    y0 = null; win.style.transition = 'transform .3s var(--spring)';
    if (dy > 70) closeDialog(d); else win.style.transform = '';
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
});

/* add / edit sheet */
const form = $('#form');
$('#meals').innerHTML = Object.entries(MEALS).map(([m, v]) =>
  `<label style="--bg:${v.c}"><input type="radio" name="meal" value="${m}"><span>${v.e} ${m}</span></label>`).join('');

function showPhoto() {
  $('#preview').hidden = $('#rmPhoto').hidden = !photo;
  if (photo) $('#preview').src = photo;
  $('#dropHint').textContent = 'add a photo · optional';
}

let sheetRun = 0;
function openSheet(item) {
  sheetRun++;
  $('#del').disabled = false;
  editing = item ? item.id : null;
  photo = item ? item.photo : null;
  $('#fName').value = item ? item.name : '';
  form.elements.meal.value = item ? item.meal : defaultMeal(new Date().getHours());
  $('#fTime').value = item ? item.time : nowTime();
  $('#sheetT').textContent = item ? 'edit nibble' : 'new nibble ♡';
  $('#del').hidden = !item;
  $('#file').value = '';
  showPhoto();
  buzz(6);
  const from = item ? () => $(`.card[data-id="${item.id}"]`) : () => $('#fab');
  openWith($('#sheet'), from, () => {
    $('#sheet .win').scrollTop = 0;
    // desktop: jump straight to typing. phones: don't pop the keyboard over the sheet
    if (matchMedia('(hover:hover)').matches) $('#fName').focus(); else $('#sheet .win').focus({ preventScroll: true });
  });
}

async function shrink(file) {
  const img = await createImageBitmap(file); // throws for anything that isn't a decodable image
  const s = Math.min(1, 900 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * s), height: Math.round(img.height * s) });
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; // JPEG has no alpha: transparent PNGs would turn black
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  img.close();
  return c.toDataURL('image/jpeg', 0.82);
}
async function takePhoto(file) {
  if (!file) return;
  const run = sheetRun;
  try {
    if (file.type && !file.type.startsWith('image/')) throw 0; // some android galleries send no type: let decoding decide
    const shrunk = await shrink(file);
    if (run !== sheetRun) return; // she closed the sheet / opened another nibble meanwhile
    photo = shrunk;
    showPhoto();
  } catch { $('#dropHint').textContent = "hmm, couldn't read that photo 🥺"; }
}
$('#file').onchange = e => takePhoto(e.target.files[0]);
$('#rmPhoto').onclick = () => { photo = null; $('#file').value = ''; showPhoto(); };
const drop = $('#drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); takePhoto(e.dataTransfer.files[0]); };

let submitting = false;
form.onsubmit = async e => {
  e.preventDefault();
  if (submitting) return;
  const name = $('#fName').value.trim();
  if (!name) return $('#fName').focus();
  submitting = true;
  try { await submit(name); } finally { submitting = false; }
};
async function submit(name) {
  const it = { id: editing || Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    name, meal: form.elements.meal.value || 'snack', time: $('#fTime').value || nowTime(), photo };
  const prev = day.items, wasEditing = editing;
  day.items = editing ? day.items.map(x => x.id === editing ? it : x) : [...day.items, it];
  if (!await save()) { day.items = prev; return; }
  document.activeElement.blur(); // drop the android keyboard before the sheet slides away
  if (wasEditing) {
    dismiss($('#sheet'), () => $(`.card[data-id="${it.id}"]`), () => renderBoard(false)); // sheet shrinks back into its card
    toast('updated ♡');
    if (party) celebrate();
  } else {
    await dismiss($('#sheet'), () => $('#fab'));
    feed(it); // the new card lands on the board once cinnamoroll has eaten it
  }
}

$('#del').onclick = async () => {
  const k = cur, d = day, gone = d.items.find(i => i.id === editing);
  if (!gone || $('#del').disabled) return;
  $('#del').disabled = true;
  d.items = d.items.filter(i => i !== gone);
  if (!await save(k, d)) { d.items.push(gone); $('#del').disabled = false; return; }
  closeDialog($('#sheet'));
  renderBoard(false);
  toast('nibble deleted', 'undo', async () => {
    const live = cur === k ? day : await getDay(k); // never write back the stale copy: she may have changed that day since
    live.items.push(gone);
    if (await save(k, live) && cur === k) renderBoard(false, gone.id);
  });
};

/* mood + note */
$('#moods').innerHTML = Object.entries(MOODS).map(([m, e]) =>
  `<button class="mood" data-m="${m}" aria-label="${m}" aria-pressed="false">${e}</button>`).join('');
$('#moods').onclick = e => {
  const b = e.target.closest('.mood');
  if (!b) return;
  const was = day.mood, d = day;
  day.mood = day.mood === b.dataset.m ? null : b.dataset.m;
  renderMood();
  if (!calm) b.animate([{ transform: 'scale(.8)' }, { transform: 'scale(1.25) rotate(-10deg)' }, { transform: 'scale(1.08)' }], { duration: 450, easing: 'ease-out' });
  buzz(8);
  if (day.mood) cheer(MOOD_LINES[day.mood]);
  save().then(ok => { if (!ok) { d.mood = was; if (day === d) renderMood(); } });
};
let noteTimer, flushNote = null;
$('#note').oninput = e => {
  day.note = e.target.value;
  const k = cur, d = day; // capture: she may switch days before the timer fires
  clearTimeout(noteTimer);
  flushNote = async () => {
    flushNote = null; clearTimeout(noteTimer);
    if (await save(k, d)) { $('#saved').classList.add('on'); setTimeout(() => $('#saved').classList.remove('on'), 1200); }
  };
  noteTimer = setTimeout(flushNote, 800);
};

/* calendar */
let calMonth, calRun = 0;
async function renderCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), t = todayKey(), now = new Date(), run = ++calRun;
  const keys = [...Array(new Date(y, m + 1, 0).getDate())].map((_, i) => keyOf(new Date(y, m, i + 1)));
  const data = await Promise.all(keys.map(k => logged.has(k) ? getDay(k).catch(() => null) : null));
  if (run !== calRun) return; // a newer month tap finished first
  $('#cTitle').textContent = new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }).toLowerCase();
  $('#cNext').disabled = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());
  const blanks = '<span></span>'.repeat((new Date(y, m, 1).getDay() + 6) % 7);
  $('#cGrid').innerHTML = ['mo', 'tu', 'we', 'th', 'fr', 'sa', 'su'].map(w => `<span class="wd">${w}</span>`).join('') + blanks +
    keys.map((k, i) => {
      const d = data[i], ph = d && d.items.find(x => x.photo);
      const emo = d && !ph ? (d.items[0] ? guess(d.items[0].name) || MEALS[d.items[0].meal].e : MOODS[d.mood] || '✎') : '';
      const cls = [d && 'has', ph && 'ph', k === t && 'today', k === cur && 'sel'].filter(Boolean).join(' ');
      return `<button class="cd ${cls}" data-k="${k}" ${k > t ? 'disabled' : ''} ${ph ? `style="background-image:url(${ph.photo})"` : ''}
        aria-label="${dateOf(k).toDateString()}${d ? ', logged' : ''}"><span>${i + 1}</span>${emo ? `<em>${emo}</em>` : ''}</button>`;
    }).join('');
}
$('#calBtn').onclick = async () => { const d = dateOf(cur); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); await renderCal(); openWith($('#cal'), () => $('#calBtn')); };
$('#cPrev').onclick = () => { calMonth.setMonth(calMonth.getMonth() - 1); renderCal(); };
$('#cNext').onclick = () => { calMonth.setMonth(calMonth.getMonth() + 1); renderCal(); };
$('#cGrid').onclick = e => { const b = e.target.closest('.cd'); if (b) dismiss($('#cal')).then(() => go(b.dataset.k)); };

/* nav */
$('#days').onclick = e => { const b = e.target.closest('.day'); if (b) go(b.dataset.k); };
$('#prev').onclick = () => go(addDays(cur, -7), -1);
$('#next').onclick = () => { const k = addDays(cur, 7), t = todayKey(); go(k > t ? t : k, 1); };
$('#todayBtn').onclick = () => go(todayKey(), 1);
$('#fab').onclick = () => openSheet();
$('#board').onclick = e => { const c = e.target.closest('.card'); if (c) openSheet(day.items.find(i => i.id === c.dataset.id)); };
addEventListener('resize', () => { if (colCount() !== cols) renderBoard(false); });
function checkDay() { // left open past midnight
  const t = todayKey();
  if (t === lastToday || document.querySelector('dialog[open]')) return; // never swap the day under an open sheet
  const was = lastToday;
  lastToday = t;
  if (cur === was) go(t, 1); else renderHero();
}
setInterval(checkDay, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return flushNote && flushNote(); // android may kill a backgrounded tab: save the note now
  checkDay();
});

/* living mascots + juice */
const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
let peekT;
function cheer(text = pick(CHEERS)) {
  $('#bubble').textContent = text;
  $('#peek').classList.add('on');
  clearTimeout(peekT);
  peekT = setTimeout(() => $('#peek').classList.remove('on'), 2600);
}

// food token flies from the + button along an arc into a point
function fly(it, [x0, y0], [x1, y1]) {
  const t = document.createElement(it.photo ? 'img' : 'span');
  t.className = 'token';
  if (it.photo) t.src = it.photo; else t.textContent = guess(it.name) || MEALS[it.meal].e;
  t.style.cssText = `left:${x0}px;top:${y0}px`;
  document.body.append(t);
  const lift = Math.min(200, innerHeight * .25);
  const frames = [...Array(17)].map((_, i) => {
    const p = i / 16, x = (x1 - x0) * p, y = (y1 - y0) * p - Math.sin(p * Math.PI) * lift;
    return { transform: `translate(-50%,-50%) translate(${x}px,${y}px) rotate(${p * 420}deg) scale(${1 - p * .6})` };
  });
  return t.animate(frames, { duration: 720, easing: 'cubic-bezier(.45,0,.55,1)' }).finished.finally(() => t.remove());
}

let feedRun = 0;
async function feed(it) {
  const run = ++feedRun, nap = $('.nap'), peeker = $('#cinna');
  // only ever one cinnamoroll: use the one she can already see, else he rises from the bottom
  const host = !$('#empty').hidden && onScreen(nap) ? nap : onScreen(peeker) ? peeker : $('#feeder');
  try {
    if (calm) return cheer();
    host.classList.remove('open', 'chew', 'talk');
    host.classList.add('on');
    await sleep(host === nap ? 250 : 480);
    host.classList.add('open');
    buzz(6);
    await sleep(120);
    const r = host.querySelector('svg').getBoundingClientRect(), mouth = [r.left + r.width / 2, r.top + r.height * 90 / 170];
    await fly(it, center($('#fab')), mouth);
    host.classList.remove('open');
    host.classList.add('chew', 'talk');
    buzz([14, 60, 14, 60, 14]);
    const got = new Set(day.items.map(i => i.meal)).size, line = got === 5 ? 'tummy full!! ♡' : pick(CHEERS);
    if (host.id === 'feeder') $('#fbubble').textContent = line; else cheer(line);
    burst(mouth[0], mouth[1] - 10, 12, 90, '♡✦♡');
    if (host === nap) await sleep(1300); // let him finish chewing before the first card replaces him
  } finally {
    renderBoard(false, it.id); // the card drops onto the board as he chews
  }
  if (party) celebrate();
  await sleep(1800);
  if (run === feedRun) host.classList.remove('on', 'open', 'chew', 'talk');
}

/* holo tilt: mouse on desktop, gyroscope on phones */
const tiltProps = ['--rx', '--ry', '--mx', '--my', '--hx'];
$('#board').addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || calm) return;
  const c = e.target.closest('.card');
  if (!c) return;
  const r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  c.classList.add('tilt');
  c.style.setProperty('--rx', `${(.5 - py) * 16}deg`);
  c.style.setProperty('--ry', `${(px - .5) * 18}deg`);
  c.style.setProperty('--mx', `${px * 100}%`);
  c.style.setProperty('--my', `${py * 100}%`);
  c.style.setProperty('--hx', `${px * 100}%`);
});
$('#board').addEventListener('pointerout', e => {
  const c = e.target.closest('.card');
  if (c && !c.contains(e.relatedTarget)) { c.classList.remove('tilt'); tiltProps.forEach(p => c.style.removeProperty(p)); }
});
const clamp = (v, a) => Math.max(-a, Math.min(a, v));
let gyroBase = null, gyroRaf = 0, gx = 0, gy = 0, shownGx = 0, shownGy = 0, boardSeen = true;
new IntersectionObserver(([en]) => { boardSeen = en.isIntersecting; }).observe($('#board'));
addEventListener('deviceorientation', e => {
  if (e.beta == null || calm || !boardSeen || document.querySelector('dialog[open]')) return;
  if (!gyroBase) gyroBase = { b: e.beta, g: e.gamma };
  // the neutral pose slowly follows however she's holding the phone, so only movement tilts the cards
  gyroBase.b += (e.beta - gyroBase.b) * .02;
  gyroBase.g += (e.gamma - gyroBase.g) * .02;
  gx = clamp(e.gamma - gyroBase.g, 14);
  gy = clamp(e.beta - gyroBase.b, 14);
  if (Math.abs(gx - shownGx) < .4 && Math.abs(gy - shownGy) < .4) return; // sensor noise: nothing visible would change
  if (!gyroRaf) gyroRaf = requestAnimationFrame(() => {
    gyroRaf = 0;
    shownGx = gx; shownGy = gy;
    const b = $('#board'), holo = Math.min(1, (Math.abs(gx) + Math.abs(gy)) / 6); // shine shows while she moves
    b.style.setProperty('--gx', gx.toFixed(2));
    b.style.setProperty('--gy', gy.toFixed(2));
    b.style.setProperty('--holo', holo.toFixed(2));
    b.classList.toggle('shine', holo > .15); // above the noise floor the 0.4° filter can leave behind
  });
});
// iOS asks permission for motion; android/desktop don't need this
addEventListener('pointerdown', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {});
}, { once: true });
function hop(el, deg) {
  if (!calm) el.animate([{ transform: 'none' }, { transform: `translateY(-16px) rotate(${deg}deg)` }, { transform: 'none' }], { duration: 480, easing: 'ease-out' });
  burst(...center(el), 7, 50, '♡');
}
$('#cinna').onclick = e => hop(e.currentTarget, 6);
$('#kittyBtn').onclick = e => hop(e.currentTarget, -8);
document.addEventListener('click', e => {
  if (e.detail && !e.target.closest('input,textarea,dialog,.pup,#kittyBtn')) burst(e.clientX, e.clientY, 4, 26, '✦♡', 12);
});

// blinks: a 140ms class toggle at random gaps, so nothing runs on the main thread between blinks
if (!calm) document.querySelectorAll('[data-blink]').forEach(el => {
  const loop = () => el.isConnected && setTimeout(() => {
    el.classList.add('shut');
    setTimeout(() => { el.classList.remove('shut'); loop(); }, 140);
  }, 2500 + Math.random() * 4500);
  loop();
});

// 5/5 hearts: the day's food rains down once, both mascots cheer
function celebrate() {
  party = false;
  buzz([30, 50, 30, 50, 120]);
  cheer('TUMMY FULL!! ♡');
  if (onScreen($('#cinna'))) hop($('#cinna'), 6);
  if (calm) return;
  const foods = [...new Set(day.items.map(i => guess(i.name) || MEALS[i.meal].e))];
  for (let i = 0; i < 28; i++) {
    const s = Object.assign(document.createElement('span'), { className: 'rain', textContent: foods[i % foods.length] });
    s.style.left = `${Math.random() * 96}vw`;
    document.body.append(s);
    s.animate([{ transform: 'translateY(-12vh) rotate(0deg)' }, { transform: `translateY(112vh) rotate(${Math.random() * 720 - 360}deg)` }],
      { duration: 1700 + Math.random() * 1300, delay: Math.random() * 600, easing: 'cubic-bezier(.45,0,.8,.6)', fill: 'backwards' }).onfinish = () => s.remove();
  }
}

/* share my plate: draws the day as a 1080×1350 polaroid postcard and hands it to the share sheet */
const cssColor = v => getComputedStyle(document.documentElement).getPropertyValue(v.slice(4, -1)).trim(); // 'var(--butter)' → '#FFE9A8'
const loadImg = src => new Promise((res, rej) => Object.assign(new Image(), { onload() { res(this); }, onerror: rej, src }));
const mascotImg = (id, vb) => loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${$('#' + id).innerHTML.replaceAll('var(--hallo,0)', OCT ? '1' : '0')}</svg>`));
async function postcard() {
  const W = 1080, H = 1350, ink = '#5B3A3A', ink2 = '#9A7470';
  const c = Object.assign(document.createElement('canvas'), { width: W, height: H }), g = c.getContext('2d');
  g.fillStyle = '#FFF6EC'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#F6DCCB';
  for (let y = 15; y < H; y += 30) for (let x = 15; x < W; x += 30) { g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill(); }
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.fillStyle = ink; g.font = '700 78px Fredoka'; g.fillText('tummy diary ♡', W / 2, 125);
  g.fillStyle = ink2; g.font = '800 34px Nunito';
  g.fillText(dateOf(cur).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).toLowerCase(), W / 2, 180);

  // polaroid grid, sized to fit however many nibbles (max 6 shown)
  const items = [...day.items].sort((a, b) => a.time.localeCompare(b.time)), shown = items.slice(0, 6), n = shown.length;
  const cols = n <= 2 ? n : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols), top = 235, areaH = 790, gap = 46;
  const pw = Math.min((W - 120 - (cols - 1) * gap) / cols, (areaH - (rows - 1) * gap) / rows / 1.18, 440), ph = pw * 1.18;
  const x0 = (W - (cols * pw + (cols - 1) * gap)) / 2, y0 = top + (areaH - (rows * ph + (rows - 1) * gap)) / 2;
  const imgs = await Promise.all(shown.map(it => it.photo ? loadImg(it.photo).catch(() => null) : null));
  shown.forEach((it, i) => {
    const h = hash(it.id), cx = x0 + (i % cols) * (pw + gap) + pw / 2, cy = y0 + Math.floor(i / cols) * (ph + gap) + ph / 2;
    const m = MEALS[it.meal], pad = pw * .05, picH = ph - pad - pw * .22;
    g.save(); g.translate(cx, cy); g.rotate(((h >>> 13) % 5 - 2) * .025);
    g.fillStyle = '#F3AFBD'; g.beginPath(); g.roundRect(-pw / 2 + 7, -ph / 2 + 9, pw, ph, 14); g.fill();
    g.fillStyle = '#fff'; g.strokeStyle = ink; g.lineWidth = 4;
    g.beginPath(); g.roundRect(-pw / 2, -ph / 2, pw, ph, 14); g.fill(); g.stroke();
    const px = -pw / 2 + pad, py = -ph / 2 + pad, pW = pw - 2 * pad;
    g.save(); g.beginPath(); g.roundRect(px, py, pW, picH, 10); g.clip();
    if (imgs[i]) { // cover-fit the photo
      const im = imgs[i], s = Math.max(pW / im.width, picH / im.height);
      g.drawImage(im, px + (pW - im.width * s) / 2, py + (picH - im.height * s) / 2, im.width * s, im.height * s);
    } else {
      g.fillStyle = cssColor(m.c); g.fillRect(px, py, pW, picH);
      g.font = `${pW * .38}px sans-serif`; g.textBaseline = 'middle'; g.fillText(guess(it.name) || m.e, 0, py + picH / 2);
      g.textBaseline = 'alphabetic';
    }
    g.restore();
    g.fillStyle = ink; g.font = `600 ${pw * .085}px Fredoka`;
    let name = it.name;
    while (g.measureText(name).width > pW && name.length > 3) name = name.slice(0, -2);
    g.fillText(name === it.name ? name : name + '…', 0, ph / 2 - pw * .07);
    g.rotate(((h >>> 15) % 7 - 3) * .04); // washi tape
    g.fillStyle = ['#F7B9C6', '#B9DCF3', '#FFE08F', '#E2D4F6'][(h >>> 3) % 4]; g.globalAlpha = .9;
    g.fillRect(-pw * .17, -ph / 2 - 16, pw * .34, 34);
    g.restore();
  });
  g.textAlign = 'center';
  if (items.length > 6) { g.fillStyle = ink2; g.font = '800 30px Nunito'; g.fillText(`+ ${items.length - 6} more ${items.length === 7 ? 'nibble' : 'nibbles'}`, W / 2, top + areaH + 28); }

  // footer: mascots, mood, tummy hearts
  const [kitty, pup] = await Promise.all([mascotImg('kitty', '0 0 120 100'), mascotImg('pup', '0 0 200 170')]);
  g.drawImage(kitty, 50, 1105, 210, 175);
  g.drawImage(pup, W - 290, 1080, 240, 204);
  const got = new Set(day.items.map(i => i.meal)).size, heart = new Path2D(HEART);
  for (let i = 0; i < 5; i++) {
    g.save(); g.translate(W / 2 - 150 + i * 62, 1150); g.scale(2.3, 2.3);
    g.fillStyle = i < got ? '#F07C98' : '#fff'; g.strokeStyle = ink; g.lineWidth = 1.4;
    g.fill(heart); g.stroke(heart); g.restore();
  }
  g.fillStyle = ink; g.font = '700 40px Fredoka';
  g.fillText(day.mood ? `${MOODS[day.mood]} feeling ${MOOD_NAMES[day.mood]}` : `${items.length} ${items.length === 1 ? 'nibble' : 'nibbles'} today`, W / 2, 1270);
  g.fillStyle = ink2; g.font = '800 26px Nunito';
  g.fillText(got === 5 ? 'tummy full! ✿' : `tummy happiness ${got}/5`, W / 2, 1312);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
$('#shareBtn').onclick = async () => {
  const btn = $('#shareBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const blob = await postcard(), file = new File([blob], `tummy-diary-${cur}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'my tummy diary ♡' }).catch(() => {}); // cancelled share is fine
    } else { // desktop: just save the png
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: file.name });
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('postcard saved ♡');
    }
  } catch { toast("couldn't make the postcard 🥺"); }
  finally { btn.disabled = false; }
};

/* october */
if (OCT) {
  document.body.classList.add('s-oct');
  $('#loadMsg').textContent = 'stirring the cauldron…';
  $('.sky').insertAdjacentHTML('beforeend', '<span class="tw" style="top:22%;left:12%;--s:22px;opacity:.6">🦇</span><span class="tw" style="top:58%;right:9%;--dl:-1.4s;--s:18px;opacity:.6">🦇</span>');
}

let toastTimer;
function toast(msg, action, fn) {
  const t = $('#toast');
  t.replaceChildren(Object.assign(document.createElement('span'), { textContent: msg }));
  if (action) {
    const b = Object.assign(document.createElement('button'), { textContent: action });
    b.onclick = () => { t.classList.remove('show'); fn(); };
    t.append(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2200);
}

function burst(x, y, n = 12, dist = 60, chars = '♡✦✿☁', fs = 18) {
  if (calm) return;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span'), a = (i / n) * Math.PI * 2 + Math.random() * .5, d = dist * (.6 + Math.random() * .6);
    s.className = 'spark';
    s.textContent = chars[i % chars.length];
    s.style.cssText = `left:${x}px;top:${y}px;--fs:${fs}px;color:${i % 2 ? 'var(--pink)' : 'var(--blue-d)'}`;
    document.body.append(s);
    s.animate([
      { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(1.1) rotate(${Math.random() * 90 - 45}deg)`, opacity: 0 },
    ], { duration: 650 + Math.random() * 300, easing: 'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => s.remove();
  }
}

/* boot */
(async () => {
  const minWait = sleep(calm ? 0 : 1250);
  let failed = false;
  try {
    logged = new Set(await tx('readonly', s => s.getAllKeys()));
    day = await getDay(cur);
    navigator.storage?.persist?.().catch(() => {}); // otherwise android can wipe IndexedDB when the phone is low on space
  } catch { failed = true; }
  render(0, false);
  await Promise.all([minWait, Promise.race([document.fonts.ready, sleep(2500)])]); // no font flash, but never hang offline
  $('#loader').classList.add('done');
  setTimeout(() => $('#loader').remove(), 700); // stop its looping animations for good
  document.body.classList.add('ready');
  await sleep(250);
  renderBoard(true); // cards drop in once they're actually visible
  if (failed) toast("couldn't open your diary storage 🥺");
})();
</script>
